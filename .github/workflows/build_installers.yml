name: build_installers

# Two ways to run this:
#
# 1. Manual: click "Run workflow" (Actions tab), pick which platform(s) to
#    build, one architecture shared across all of them, and whether to
#    publish. Good for testing one platform at a time.
# 2. Automatic: push a tag matching "dev-v*" (e.g. `git tag dev-v1 && git
#    push origin dev-v1`). Builds all three platforms for x86_64 and always
#    publishes, under that exact tag name instead of the rolling
#    "dev-build" the manual path uses — so each tagged run gets its own
#    permanent Release page rather than overwriting the last one.
#
# Deliberately NOT "v*": that's the exact pattern release.yml (the real Zed
# release pipeline) already listens for. Every job in that workflow is
# gated to zed-industries/zed-extensions only, so it's inert here either
# way — but a distinct prefix keeps the two fully separate at the trigger
# level too, and avoids ever colliding with one of Zed's own real version
# tags if you fetch upstream's tags into this fork later.
#
# Either way, check the result in a browser — this run's Artifacts section,
# or the Release page.
#
# No code-signing certs needed for any platform: each OS's bundling script
# already falls back to an unsigned (Windows) or ad-hoc-signed, non-
# notarized (macOS) build when the real signing secrets aren't set, which
# is the case here since this workflow doesn't set them. Linux binaries
# were never signed in the first place. See each job's own comments below
# for what that means when you actually try to run the result.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture (applies to every platform built)
        required: false
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
      build_windows:
        description: Build Windows (.exe installer)
        required: false
        type: boolean
        default: true
      build_linux:
        description: Build Linux (.tar.gz bundle + .deb)
        required: false
        type: boolean
        default: true
      build_macos:
        description: Build macOS (.dmg)
        required: false
        type: boolean
        default: true
      publish_release:
        description: >-
          Publish every platform built to one shared GitHub Release (tag
          "dev-build", overwritten on every run) so the whole set has a
          permanent, shareable browser link — not just this run's
          Artifacts, which expire.
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "dev-v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # workflow_dispatch's `inputs` context doesn't exist on a tag push, so
  # every other job reads its settings from here instead of `inputs.*`
  # directly — this is the one place that knows which trigger fired and
  # fills in the "build everything, x86_64, publish" defaults for the tag
  # path, or passes the manual dispatch's own choices straight through.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      architecture: ${{ steps.resolve.outputs.architecture }}
      build_windows: ${{ steps.resolve.outputs.build_windows }}
      build_linux: ${{ steps.resolve.outputs.build_linux }}
      build_macos: ${{ steps.resolve.outputs.build_macos }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Resolve build parameters
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "architecture=x86_64" >> "$GITHUB_OUTPUT"
            echo "build_windows=true" >> "$GITHUB_OUTPUT"
            echo "build_linux=true" >> "$GITHUB_OUTPUT"
            # Disabled on tag push: webrtc-sys fails to build against every
            # Xcode on the macos-14 runner we've tried so far (15.4's libc++
            # tightened a C++20 concept check that cxx-rs's generated
            # rust::Slice<T>::iterator doesn't satisfy; pinning back to
            # 15.0.1 didn't avoid it either). Still available manually via
            # workflow_dispatch's build_macos input if you want to retry.
            echo "build_macos=false" >> "$GITHUB_OUTPUT"
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            # dev-v38 -> 38: the fourth part of the installer version
            # (1.27.0.38), so winget and Windows see each release as newer.
            build_number="${GITHUB_REF_NAME#dev-v}"
            case "$build_number" in
              ''|*[!0-9]*) build_number=0 ;;
            esac
            echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=${{ inputs.architecture }}" >> "$GITHUB_OUTPUT"
            echo "build_windows=${{ inputs.build_windows }}" >> "$GITHUB_OUTPUT"
            echo "build_linux=${{ inputs.build_linux }}" >> "$GITHUB_OUTPUT"
            echo "build_macos=${{ inputs.build_macos }}" >> "$GITHUB_OUTPUT"
            echo "publish_release=${{ inputs.publish_release }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=dev-build" >> "$GITHUB_OUTPUT"
            # Untagged test builds: lower than any tagged release.
            echo "build_number=0" >> "$GITHUB_OUTPUT"
          fi

  build_windows:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_windows == 'true' }}
    # script/bundle-windows.ps1 assumes Inno Setup 6 is preinstalled at a
    # fixed path only the 2022 runner image has by default — pin the image
    # rather than "windows-latest", which will eventually move to 2025 and
    # break this silently.
    runs-on: windows-2022
    # 120 wasn't enough on a cold cache (dev-v5: "No cache found", cancelled
    # at exactly 2h0m mid-compile) — rust-cache misses happen whenever the
    # cache key (keyed off Cargo.lock et al.) changes enough since the last
    # run, so budget for a from-scratch build, not just a warm-cache one.
    timeout-minutes: 180
    env:
      # Read by script/lib/workspace.ps1 for the installer version.
      # Also compiled into the app (option_env! in crates/auto_update), which
      # is how its update check knows which release it is.
      FORGE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Skips code signing gracefully when the Azure signing secrets aren't
      # set (they aren't here) — see its own CheckEnvironmentVariables.
      # The resulting installer .exe will trigger a Windows SmartScreen
      # warning on first run ("Windows protected your PC") — bypass with
      # "More info" -> "Run anyway". Expected for an unsigned installer,
      # not a build failure.
      - name: Build the installer (script/bundle-windows.ps1)
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Architecture ${{ needs.prepare.outputs.architecture }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ needs.prepare.outputs.architecture }}
          # bundle-windows.ps1 exports the installer's path (its file name
          # comes from the channel's $appSetupName), so this follows renames.
          path: ${{ env.SETUP_PATH }}
          if-no-files-found: error

  build_linux:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_linux == 'true' }}
    # GitHub's hosted Arm64 Linux runners (public repos, no extra cost) —
    # falls back to the regular x64 image otherwise.
    runs-on: ${{ needs.prepare.outputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    # See build_windows's identical comment — 120 wasn't enough on a cold
    # rust-cache miss (dev-v5 was cancelled at exactly 2h0m mid-compile).
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      # Becomes the fourth part of the .deb's version (script/bundle-deb),
      # so each release is newer to apt than the last.
      # Also compiled into the app (option_env! in crates/auto_update), which
      # is how its update check knows which release it is.
      FORGE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      # A full Zed release build (native target + a second musl build for
      # remote_server) is disk-hungry; GitHub's default runner image only
      # has ~14GB free after its preinstalled toolchains. Clear headroom
      # rather than find out mid-build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download the WASI SDK (for bundled extensions)
        run: ./script/download-wasi-sdk

      # Produces a .tar.gz containing a self-contained forge-super.app/
      # directory (binary + bundled libs + .desktop file + icons) — this is
      # the only format Zed's own scripts produce for Linux (besides,
      # separately, script/bundle-flatpak for Flatpak, which this fork
      # hasn't rebranded). Extract the tarball and run bin/forge-super, or
      # copy the .desktop file into ~/.local/share/applications for a menu
      # entry.
      - name: Build the bundle (script/bundle-linux)
        run: ./script/bundle-linux

      # Not an official Zed artifact — script/bundle-deb is this fork's own
      # addition, repackaging the tarball above into a real .deb (installs
      # to /usr/lib/<pkg>, /usr/bin/forge-super symlink, desktop/icon
      # entries) since nothing upstream produces one. See that script's own
      # comments for what it does and doesn't handle (there's no Depends: —
      # the bundled libs cover most of it, see the script for why the rest
      # is left undeclared rather than guessed).
      - name: Build the .deb package (script/bundle-deb)
        run: ./script/bundle-deb ${{ needs.prepare.outputs.architecture }}

      # Publishes an actual `apt`-installable repository at
      # downloads.mentenaz-server.com, separate from the raw .deb already
      # uploaded as a workflow artifact / attached to the GitHub release.
      # aptly builds the repo fresh each run (dists/, pool/, a GPG-signed
      # Release) from just this run's .deb — it doesn't carry history
      # forward from previous runs, so the published repo always serves
      # only the latest version per architecture. Older versions stay
      # downloadable via GitHub Releases, just not through `apt` itself.
      # Only for runs that publish a release. The repo is rebuilt from just
      # this run's .deb and overwrites what is on the server, so a manual
      # test run (build number 0, publish_release=false) would otherwise
      # replace the real release with a test build.
      - name: Publish the apt repository
        if: ${{ needs.prepare.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          GPG_FPR="42E9F3A7505F1AAD3DA6DCDFF128FBB1B8210F56"

          # aptly ships .zip releases, not .tar.gz, and amd64/arm64 (not
          # x86_64/aarch64) in its asset names.
          APTLY_VERSION="1.6.3"
          APTLY_ARCH="${{ needs.prepare.outputs.architecture == 'aarch64' && 'arm64' || 'amd64' }}"
          curl -fsSL -o /tmp/aptly.zip \
            "https://github.com/aptly-dev/aptly/releases/download/v${APTLY_VERSION}/aptly_${APTLY_VERSION}_linux_${APTLY_ARCH}.zip"
          unzip -q /tmp/aptly.zip -d /tmp/aptly_extracted
          APTLY=/tmp/aptly_extracted/aptly_${APTLY_VERSION}_linux_${APTLY_ARCH}/aptly

          "$APTLY" repo create -distribution="stable" -component="main" forge-super
          "$APTLY" repo add forge-super target/release/*.deb
          "$APTLY" publish repo -batch -gpg-key="$GPG_FPR" forge-super

          # The public half of the signing key, for users to import before
          # adding the repo — see docs/src/linux.md for the sources.list
          # line and import command this pairs with.
          gpg --export --armor "$GPG_FPR" > ~/.aptly/public/mentenaz.gpg

          # The one-line installer (curl .../install.sh | sudo sh). It pins
          # this key's fingerprint, so it ships from the same commit as the
          # repository it sets up.
          install -m 0644 script/install.sh ~/.aptly/public/install.sh

      - name: Deploy the apt repository to downloads.mentenaz-server.com
        if: ${{ needs.prepare.outputs.publish_release == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AFRIHOST_FTP_HOST }}
          username: ${{ secrets.AFRIHOST_FTP_USERNAME }}
          password: ${{ secrets.AFRIHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: /home/runner/.aptly/public/
          server-dir: /
          # false (the default) only uploads what changed and never
          # deletes remote files missing locally — important since
          # local-dir only ever contains this run's dists/, pool/, and the
          # exported key, not the whole history; a clean-slate sync would
          # wipe anything else already on the subdomain.
          dangerous-clean-slate: false

      - name: Upload artifact — Forge Super (tarball)
        uses: actions/upload-artifact@v4
        with:
          name: forge-super-linux-${{ needs.prepare.outputs.architecture }}.tar.gz
          path: target/release/forge-super-linux-${{ needs.prepare.outputs.architecture }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact — Forge Super (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: forge-super-linux-${{ needs.prepare.outputs.architecture }}.deb
          path: target/release/*.deb
          if-no-files-found: error

      - name: Upload artifact — remote_server
        uses: actions/upload-artifact@v4
        with:
          name: forge-super-remote-server-linux-${{ needs.prepare.outputs.architecture }}.gz
          path: target/forge-super-remote-server-linux-${{ needs.prepare.outputs.architecture }}.gz
          if-no-files-found: error

  build_macos:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_macos == 'true' }}
    # Apple Silicon runner — GitHub retired Intel-hosted macOS images, so
    # the x86_64 build cross-compiles from here (rustc/Xcode both support
    # it out of the box; script/bundle-mac takes the target triple as an
    # explicit argument specifically for this — release.yml's own
    # bundle_mac_x86_64 job does the same from the same runner type).
    runs-on: macos-14
    timeout-minutes: 120
    # Disabled by default on tag push (see prepare's build_macos output) —
    # webrtc-sys fails to build with "implicit instantiation of undefined
    # template std::__pointer_traits_element_type<rust::Slice<...>::iterator>"
    # (cxx-rs's generated rust::Slice<T>::iterator doesn't satisfy the C++20
    # `contiguous_iterator` concept libc++ checks for, at -std=c++20 per
    # webrtc-sys's own build.rs). Pinning DEVELOPER_DIR to Xcode 15.0.1
    # below did NOT fix it — still fails the same way — so this is left
    # pinned only as a documented starting point for whoever revisits this;
    # it is not a working fix. Likely needs an upstream cxx-rs/livekit-rust-sdks
    # fix, or building webrtc-sys at -std=c++17 instead (requires patching
    # the vendored build.rs via a Cargo [patch] fork, not done here). Bump
    # this once the pinned livekit-rust-sdks rev (see root Cargo.toml) picks
    # up an upstream cxx-rs fix.
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.0.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # dmg-license (script/bundle-mac embeds a license agreement into the
      # DMG) is an npm package — pin a version rather than trust whatever
      # Node happens to be preinstalled on the runner image.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version

      # Falls back to an ad-hoc signature (`codesign --sign -`) when the
      # real Apple Developer signing secrets aren't set (they aren't here).
      # An ad-hoc-signed, non-notarized .dmg downloaded from a browser WILL
      # be blocked by Gatekeeper on first open ("Apple could not verify...")
      # — right-click the app -> Open (instead of double-clicking), or
      # `xattr -cr /Applications/Zed*.app` after copying it over. Expected
      # for an unsigned build, not a build failure.
      - name: Build the bundle (script/bundle-mac)
        run: |
          triple="aarch64-apple-darwin"
          if [ "${{ needs.prepare.outputs.architecture }}" = "x86_64" ]; then
            triple="x86_64-apple-darwin"
          fi
          ./script/bundle-mac "$triple"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zed-${{ needs.prepare.outputs.architecture }}.dmg
          path: target/${{ needs.prepare.outputs.architecture == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}/release/Zed-${{ needs.prepare.outputs.architecture }}.dmg
          if-no-files-found: error

  publish_release:
    needs: [prepare, build_windows, build_linux, build_macos]
    # Runs even if some platforms were skipped (unticked) or failed, and
    # publishes whatever did succeed — one un-ticked or failed platform
    # shouldn't block the others from reaching the Release.
    if: ${{ always() && needs.prepare.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level permissions block replaces the workflow's top-level one
    # entirely, so `contents: write` (for `gh release create/upload`) has to
    # be repeated here alongside what the attestation step needs.
    permissions:
      contents: write # publish the Release
      id-token: write # request the short-lived Sigstore signing certificate
      attestations: write # store the attestation with the repository
      artifact-metadata: write # record the attested files (actions/attest v4)
    steps:
      - name: Download Windows artifact
        if: ${{ needs.build_windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ needs.prepare.outputs.architecture }}
          path: dist

      - name: Download Linux artifacts
        if: ${{ needs.build_linux.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: forge-super*-linux-${{ needs.prepare.outputs.architecture }}.*
          path: dist
          merge-multiple: true

      - name: Download macOS artifact
        if: ${{ needs.build_macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: Zed-${{ needs.prepare.outputs.architecture }}.dmg
          path: dist

      # Signed SLSA build provenance for every file about to be published,
      # so anyone can check a download was built by this workflow from this
      # repository, unmodified:
      # gh attestation verify <file> --repo mentenaz/mentenaz.Forge.Super
      # Done here rather than in each build job: one step instead of three.
      # The files pass through upload/download-artifact first, but within
      # the same workflow run, so the claim still holds. Skipped when
      # nothing was downloaded (the publish step then reports why).
      # actions/attest replaces actions/attest-build-provenance from v4;
      # pinned to the v4.2.2 commit.
      - name: Attest build provenance
        if: ${{ hashFiles('dist/*') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo (it only needs the downloaded
          # artifacts), so `gh` has no .git dir to infer the repo from —
          # "failed to run git: fatal: not a git repository" without this.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ARCH: ${{ needs.prepare.outputs.architecture }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts to publish — every build was skipped or failed."
            exit 1
          fi

          # What changed: the annotated tag's message, which the release
          # process writes as "dev-vN: first change, second change, ...". It is
          # shown first, as a list, because the release notes page on the
          # website (and "View release notes" in the app) is built from this
          # body. A lightweight tag, a manual run or a message that is not in
          # that form just gets no list.
          WHATS_NEW=""
          if [ "$RELEASE_TAG" != "dev-build" ]; then
            tag_object=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.type + " " + .object.sha' 2>/dev/null || true)
            if [ "${tag_object%% *}" = "tag" ]; then
              tag_message=$(gh api "repos/${GH_REPO}/git/tags/${tag_object##* }" \
                --jq .message 2>/dev/null | head -n 1 || true)
              summary="${tag_message#*: }"
              if [ -n "$summary" ] && [ "$summary" != "$tag_message" ]; then
                items=$(printf '%s\n' "$summary" | sed -e 's/, /\n/g' | sed -E 's/^(.)/- \U\1/')
                WHATS_NEW=$(printf '## What changed\n\n%s\n' "$items")
              fi
            fi
          fi

          # The release body is written to a file so it can be several
          # paragraphs without fighting shell quoting; the unquoted heredoc
          # lets the tag and architecture expand (backticks are escaped so the
          # shell does not treat them as command substitution).
          cat > release-notes.md <<EOF
          ${WHATS_NEW}

          **Mentenaz Forge Super** is a *developer cockpit* built on the
          open-source [Zed](https://github.com/zed-industries/zed) editor: a
          native Rust/GPUI workspace that folds the tooling normally scattered
          across separate applications into the editor itself.

          This build (\`${RELEASE_TAG}\`, \`${ARCH}\`) includes:

          - **Developer Cockpit & Dashboard** — project, runtime, dependency, Git
            and system health in one operational view.
          - **Visual Workflow Engine** — executable, branching workflows rendered
            as an interactive GPUI graph.
          - **Database Workbench** — SQLite, PostgreSQL, MySQL and MSSQL with a
            schema graph, relationship visualisation and a SQL workbench.
          - **Runtime panels** — Node, .NET, Python and Rust project tooling, each
            aware of the active project and its manifests.
          - **Package managers** — npm, NuGet, pip and Cargo, with registry search,
            installed/outdated views and security advisories (Cargo uses OSV.dev).
          - **Helm** — a native GitHub client plus a read-only repository Workspace
            tab for browsing files, commits, comparisons and code search.
          - **Git Insights, Process Monitor, Script Runner** and more.

          > **This build is not code-signed yet.**
          >
          > - **Windows:** SmartScreen warns on first run ("Windows protected your
          >   PC") — choose **More info** then **Run anyway**.
          > - **macOS:** Gatekeeper blocks the first open — right-click the app and
          >   choose **Open**, or run \`xattr -cr /Applications/Zed*.app\` after
          >   copying it over.
          > - **Linux:** an unsigned \`.tar.gz\` and \`.deb\`.

          **Check a download** was built by this repository's workflow and not
          changed since, with the [GitHub CLI](https://cli.github.com):

          \`\`\`
          gh attestation verify <downloaded file> --repo ${GH_REPO}
          \`\`\`

          Built automatically by \`build_installers.yml\`. Mentenaz Forge Super is an
          unofficial personal fork, not affiliated with, endorsed by, or
          associated with Zed Industries.
          EOF

          # Tagged releases are normal releases (winget installs from them);
          # manual "dev-build" runs stay pre-releases.
          release_kind=(--latest)
          if [ "$RELEASE_TAG" = "dev-build" ]; then
            release_kind=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Mentenaz Forge Super ${RELEASE_TAG} (${ARCH})" \
              --notes-file release-notes.md \
              "${release_kind[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      # Records the release and its files on the website, where the homepage
      # lists the direct downloads. The files stay on the GitHub Release; only
      # their URLs are sent. A failure here is reported but never fails the
      # release, and manual "dev-build" runs are not recorded. When the winget
      # package exists, its submission step belongs right after this one.
      - name: Record the release on the website
        if: ${{ success() && needs.prepare.outputs.release_tag != 'dev-build' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SYNC_SECRET: ${{ secrets.FORGE_RELEASE_SYNC_SECRET }}
        run: |
          if [ -z "$RELEASE_SYNC_SECRET" ]; then
            echo "::warning::FORGE_RELEASE_SYNC_SECRET is not set; the website was not told about ${RELEASE_TAG}."
            exit 0
          fi

          payload=$(gh release view "$RELEASE_TAG" --json name,body,publishedAt,assets | jq -c --arg tag "$RELEASE_TAG" '{
            tag: $tag,
            name: .name,
            body: .body,
            published_at: .publishedAt,
            assets: [.assets[] | {name: .name, size: .size, url: .url}]
          }')

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "https://forge.mentenaz-server.com/api/releases/sync" \
            -H "Authorization: Bearer ${RELEASE_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            --data "$payload"
          echo
