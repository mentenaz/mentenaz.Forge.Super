# Builds the macOS .dmg for a release and attaches it to that release.
#
# It starts by itself when a "dev-v*" tag is pushed, at the same moment as
# build_installers.yml, and can also be run by hand for a tag that exists
# (Actions -> build_macos -> Run workflow, with the tag, e.g. dev-v67).
#
# Why this is not a job of build_installers.yml: the release is published when all
# of that workflow's builds are done, and the Mac build alone has needed up to three
# hours (a cold build on a 3-core runner), so every release waited for it, and when
# it hit the 180 minute limit it was cancelled. Here it has its own, longer limit and
# the release does not wait for it: Windows and Linux publish the release, and this
# adds the .dmg to it when it is ready.
#
# The release is made by build_installers.yml's publish job (it writes the release
# notes). This workflow only adds its file to it: it checks for the release every
# 4 minutes, 4 times, and fails with a message if it is still missing. The .dmg
# stays available as this run's artifact either way, and a run by hand for the same
# tag attaches it again.
name: build_macos

on:
  push:
    tags:
      - "dev-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the .dmg to, e.g. dev-v67"
        required: true
        type: string
      architecture:
        description: Target architecture
        required: false
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      attach:
        description: Attach the .dmg to the release of that tag when it is built
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: 0
  # A tag push has no `inputs`: it builds the tag that was pushed, for Apple Silicon.
  TAG: ${{ inputs.tag || github.ref_name }}
  ARCH: ${{ inputs.architecture || 'aarch64' }}

permissions:
  contents: write

# One run per tag and architecture, and a new run never cancels one in progress:
# a Mac build is hours of work.
concurrency:
  group: build_macos-${{ inputs.tag || github.ref_name }}-${{ inputs.architecture || 'aarch64' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    # The hosted-runner limit is 360 minutes. A cold build here has taken just
    # over three hours to compile, and the bundle steps come after that.
    timeout-minutes: 350
    steps:
      # The tag goes into a git ref and a shell command: accept only the shape
      # of a release tag.
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^dev-v[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag like dev-v67."
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          clean: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-${{ env.ARCH }}
          # A build that runs out of time still saves what it compiled, so the
          # next run carries on from there.
          cache-on-failure: true

      # dmg-license (script/bundle-mac embeds a license agreement into the DMG)
      # is an npm package: pin the Node version rather than trust the image's.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version

      # Falls back to an ad-hoc signature when the Apple Developer signing secrets
      # are not set (they are not): see build_installers.yml for what that means
      # for Gatekeeper on first open.
      - name: Build the bundle (script/bundle-mac)
        # Ends the step before the job limit, leaving time to save the cache.
        timeout-minutes: 320
        run: |
          ./script/bundle-mac "${ARCH}-apple-darwin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ env.ARCH }}
          path: target/${{ env.ARCH }}-apple-darwin/release/Mentenaz-Forge-Super-${{ env.ARCH }}.dmg
          if-no-files-found: error

  attach:
    needs: build
    # A tag push always attaches; a run by hand can opt out.
    if: ${{ github.event_name == 'push' || inputs.attach }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repeated from the top level because a job-level block replaces it: the same
    # set build_installers.yml's publish job has.
    permissions:
      contents: write # add the file to the Release
      id-token: write # the short-lived Sigstore signing certificate
      attestations: write # store the attestation with the repository
      artifact-metadata: write # record the attested files
    steps:
      - name: Download the .dmg
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ env.ARCH }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"

      # The release is created by the Windows and Linux publish, which writes
      # its notes. Mac normally finishes after it, so this is a safety net.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tries=4
          for attempt in $(seq 1 "$tries"); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Release $TAG not found yet (try $attempt of $tries)."
            if [ "$attempt" -lt "$tries" ]; then sleep 240; fi
          done
          echo "::error::Release $TAG was not found after about 16 minutes, so the Windows and Linux publish has not run. The .dmg is kept as this run's artifact macos-dmg-${ARCH}; run build_macos again once the release exists."
          exit 1

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/*.dmg --clobber

      # Sends the release's whole file list to the website again, so the .dmg is
      # listed with the others. The website replaces the list for that tag, so
      # doing this twice is harmless. A failure is reported, never fatal.
      - name: Record the release on the website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SYNC_SECRET: ${{ secrets.FORGE_RELEASE_SYNC_SECRET }}
        run: |
          if [ -z "$RELEASE_SYNC_SECRET" ]; then
            echo "::warning::FORGE_RELEASE_SYNC_SECRET is not set; the website was not told about the .dmg."
            exit 0
          fi

          payload=$(gh release view "$TAG" --json name,body,publishedAt,assets | jq -c --arg tag "$TAG" '{
            tag: $tag,
            name: .name,
            body: .body,
            published_at: .publishedAt,
            assets: [.assets[] | {name: .name, size: .size, url: .url}]
          }')

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "https://forge.mentenaz-server.com/api/releases/sync" \
            -H "Authorization: Bearer ${RELEASE_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            --data "$payload"
          echo
